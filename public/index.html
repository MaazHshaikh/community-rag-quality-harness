<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZoisPay Q&amp;A</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --muted: #666666;
      --border: #d0d0d0;
      --accent: #2456d6;
      --error-bg: #fdecec;
      --error-text: #a11a1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161616;
        --text: #ececec;
        --muted: #a0a0a0;
        --border: #3a3a3a;
        --accent: #7aa2ff;
        --error-bg: #3a1c1c;
        --error-text: #ffb4b4;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 24px; }
    label { display: block; font-weight: 600; margin: 16px 0 4px; }
    input, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: inherit;
      font: inherit;
    }
    textarea { min-height: 96px; resize: vertical; }
    button {
      margin-top: 16px;
      padding: 8px 20px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .muted { color: var(--muted); }
    .error {
      margin-top: 24px;
      padding: 12px;
      border-radius: 6px;
      background: var(--error-bg);
      color: var(--error-text);
    }
    #result { margin-top: 24px; }
    #answer { white-space: pre-wrap; margin: 0 0 16px; }
    h2 { font-size: 1rem; margin: 0 0 4px; }
    ul { margin: 0; padding-left: 20px; }
  </style>
</head>
<body>
  <main>
    <h1>ZoisPay Q&amp;A</h1>

    <form id="ask-form" data-testid="ask-form">
      <label for="token">API token</label>
      <input id="token" data-testid="token-input" type="password" autocomplete="off" required>

      <label for="question">Question</label>
      <textarea id="question" data-testid="question-input" required></textarea>

      <button id="ask-button" data-testid="ask-button" type="submit">Ask</button>
    </form>

    <p id="loading" data-testid="loading" class="muted" hidden>Thinking…</p>

    <div id="error" data-testid="error" class="error" role="alert" hidden></div>

    <section id="result" data-testid="result" hidden>
      <p id="answer" data-testid="answer"></p>
      <h2>Sources</h2>
      <ul id="sources" data-testid="sources"></ul>
    </section>
  </main>

  <script>
    const form = document.getElementById("ask-form");
    const tokenInput = document.getElementById("token");
    const questionInput = document.getElementById("question");
    const askButton = document.getElementById("ask-button");
    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("error");
    const result = document.getElementById("result");
    const answer = document.getElementById("answer");
    const sources = document.getElementById("sources");

    const ERROR_HINTS = {
      400: "Please check your question.",
      401: "Check that your API token is correct.",
      503: "Make sure Ollama is running, then try again.",
    };

    function showError(message) {
      errorBox.textContent = message;
      errorBox.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.hidden = true;
      result.hidden = true;
      loading.hidden = false;
      askButton.disabled = true;

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${tokenInput.value.trim()}`,
          },
          body: JSON.stringify({ question: questionInput.value }),
        });
        const body = await response.json().catch(() => ({}));

        if (!response.ok) {
          const detail = body.error ?? `Request failed with status ${response.status}`;
          const hint = ERROR_HINTS[response.status];
          showError(hint ? `${detail}. ${hint}` : detail);
          return;
        }

        // textContent, not innerHTML: model output is untrusted and must never run as HTML.
        answer.textContent = body.answer;
        sources.replaceChildren(
          ...body.sources.map((source) => {
            const item = document.createElement("li");
            item.dataset.testid = "source-item";
            item.textContent = source;
            return item;
          }),
        );
        result.hidden = false;
      } catch {
        showError("Could not reach the server. Check that it is running.");
      } finally {
        loading.hidden = true;
        askButton.disabled = false;
      }
    });
  </script>
</body>
</html>
